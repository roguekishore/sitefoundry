<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Site Preview</title>
<style>
  :root {
    --bg: #0d0e10;
    --bg-glow: #1a1c21;
    --panel: #15171b;
    --line: #2a2d33;
    --text: #f2f2f0;
    --muted: #8c9099;
    --accent: #d7ff5e;
    --warn: #ffb25e;
    --bezel: #050506;
    --bezel-edge: #3a3d44;
    --screen-bg: #ffffff;
    --sans: "Inter Tight", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse 80% 60% at 50% 55%, var(--bg-glow), var(--bg) 70%);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }

  /* ---------- top bar ---------- */
  .bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    padding: 18px 28px;
  }
  .count { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .count b { color: var(--text); font-weight: 500; }
  .title { text-align: center; }
  .title h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .title p { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  .badge {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line);
  }
  .badge.live { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .badge.shot { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .pill {
    font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line);
    text-decoration: none; background: var(--panel);
  }
  .pill:hover { border-color: var(--muted); }

  /* ---------- stage: one fixed-size scene, scaled to fit ---------- */
  .stage { position: relative; min-height: 0; }
  /* The scene is laid out at real device sizes (desktop screen 1440x900, phone 390x844)
     and the whole thing is scaled down with one transform, so each iframe sees a true
     1440px or 390px wide window and the site picks its desktop or mobile layout. */
  .scene {
    position: absolute; left: 50%; top: 50%;
    width: 2040px; height: 1128px; /* monitor: 900 + 2×30 bezel + 150 neck + 18 base */
    transform-origin: center center;
  }
  .monitor { position: absolute; left: 0; top: 0; width: 1500px; }
  .monitor .frame {
    padding: 30px; border-radius: 28px; background: var(--bezel);
    box-shadow: 0 0 0 2px var(--bezel-edge), 0 60px 120px -30px rgba(0,0,0,.8);
  }
  .monitor .neck {
    width: 220px; height: 150px; margin: 0 auto;
    background: linear-gradient(90deg, #1b1d21, #2c2f35 50%, #1b1d21);
    clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%);
  }
  .monitor .base {
    width: 460px; height: 18px; margin: 0 auto; border-radius: 10px 10px 4px 4px;
    background: linear-gradient(#34373e, #1b1d21);
  }
  .phone {
    position: absolute; right: 0; bottom: 0;
    padding: 16px; border-radius: 68px; background: var(--bezel);
    box-shadow: 0 0 0 2px var(--bezel-edge), 0 50px 100px -20px rgba(0,0,0,.85);
  }
  .phone .island {
    position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 3;
  }
  .screen { position: relative; overflow: hidden; background: var(--screen-bg); }
  .monitor .screen { width: 1440px; height: 900px; border-radius: 4px; }
  .phone .screen { width: 390px; height: 844px; border-radius: 52px; }
  .screen iframe { display: block; width: 100%; height: 100%; border: 0; }
  .screen .shot { width: 100%; height: 100%; overflow-y: auto; scrollbar-width: none; }
  .screen .shot::-webkit-scrollbar { display: none; }
  .screen .shot img { display: block; width: 100%; }

  .loading, .failed {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    background: #f4f4f2; color: #44474d; font-family: var(--mono); z-index: 2;
    transition: opacity .3s;
  }
  .monitor .loading, .monitor .failed { font-size: 22px; }
  .phone .loading, .phone .failed { font-size: 15px; padding: 40px; }
  .loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 44px; height: 44px; margin: 0 auto 18px; border-radius: 50%;
    border: 3px solid #d5d6d9; border-top-color: #44474d; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- bottom: progress ticks + hint ---------- */
  .foot { padding: 14px 28px 20px; display: grid; gap: 12px; justify-items: center; }
  .ticks { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .ticks button { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
  .ticks button:hover { background: var(--muted); }
  .ticks button[aria-current="true"] { background: var(--accent); width: 38px; }
  .hint { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  kbd {
    font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }

  /* ---------- site list (press L) ---------- */
  .list {
    position: fixed; inset: 0; z-index: 10; padding: 48px;
    background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
    overflow-y: auto; display: none;
  }
  .list.open { display: block; }
  .list h2 { font-size: 13px; font-family: var(--mono); color: var(--muted); font-weight: 400; margin: 28px 0 10px; text-transform: uppercase; letter-spacing: .08em; }
  .list h2:first-child { margin-top: 0; }
  .list .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .list .grid button {
    text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
  }
  .list .grid button:hover, .list .grid button[aria-current="true"] { border-color: var(--accent); }
  .list .grid b { display: block; font-weight: 500; }
  .list .grid span { font-size: 12px; color: var(--muted); }

  @media (max-width: 700px) {
    .bar { grid-template-columns: 1fr; text-align: center; padding: 14px 16px; }
    .actions { justify-content: center; }
    .list { padding: 24px 16px; }
  }
</style>
</head>
<body>

<header class="bar">
  <div class="count"><b id="num">01</b> / <span id="total">00</span></div>
  <div class="title">
    <h1 id="name"></h1>
    <p id="meta"></p>
  </div>
  <div class="actions">
    <span id="badge" class="badge"></span>
    <button class="pill" id="listBtn" type="button">All sites</button>
    <a class="pill" id="open" target="_blank" rel="noopener">Open site ↗</a>
  </div>
</header>

<main class="stage" id="stage">
  <div class="scene" id="scene">
    <div class="monitor">
      <div class="frame"><div class="screen" id="desktop"></div></div>
      <div class="neck"></div>
      <div class="base"></div>
    </div>
    <div class="phone">
      <div class="island"></div>
      <div class="screen" id="mobile"></div>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="ticks" id="ticks"></div>
  <div class="hint"><kbd>←</kbd> <kbd>→</kbd> previous / next &nbsp;·&nbsp; <kbd>L</kbd> all sites &nbsp;·&nbsp; <kbd>R</kbd> reload &nbsp;·&nbsp; <kbd>O</kbd> open site</div>
</footer>

<div class="list" id="list"></div>

];
const SITES = GROUPS.flatMap(([group, sites]) => sites.map((s) => ({ ...s, group })));

const $ = (id) => document.getElementById(id);
const host = (url) => new URL(url).host.replace(/^www\./, "") + new URL(url).pathname.replace(/\/$/, "");
const pad = (n) => String(n).padStart(2, "0");
let index = 0;

// ---------- scale the scene to fit the stage ----------
function fit() {
  const stage = $("stage").getBoundingClientRect();
  const scene = $("scene");
  const scale = Math.min((stage.width - 48) / scene.offsetWidth, (stage.height - 16) / scene.offsetHeight);
  scene.style.transform = `translate(-50%, -50%) scale(${scale})`;
}
addEventListener("resize", fit);

// ---------- fill one screen: live iframe, or screenshot for sites that block framing ----------
function fill(screen, site, view) {
  screen.replaceChildren();
  const loading = document.createElement("div");
  loading.className = "loading";
  loading.innerHTML = `<div><div class="spinner"></div>Loading ${host(site.url)}</div>`;
  screen.append(loading);
  const done = () => loading.classList.add("hidden");
  setTimeout(done, 12000); // some sites never fire load; don't cover them forever

  if (site.shot) {
    const box = document.createElement("div");
    box.className = "shot";
    const img = new Image();
    img.alt = `${site.name}, ${view}`;
    img.onload = done;
    img.onerror = () => {
      loading.remove();
      const failed = document.createElement("div");
      failed.className = "failed";
      failed.innerHTML = `<div>${host(site.url)} blocks iframes<br>and has no screenshot yet.<br><br>node tools/site-preview/shoot.mjs ${site.shot}</div>`;
      screen.append(failed);
    };
    img.src = `shots/${site.shot}-${view}.jpg`;
    box.append(img);
    screen.append(box);
  } else {
    const frame = document.createElement("iframe");
    frame.title = `${site.name}, ${view}`;
    // No allow-top-navigation: stops a site from replacing this page with itself.
    frame.sandbox = "allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox";
    frame.onload = done;
    frame.src = site.url;
    screen.append(frame);
  }
}

function show(i) {
  index = (i + SITES.length) % SITES.length;
  const site = SITES[index];
  $("num").textContent = pad(index + 1);
  $("name").textContent = site.name;
  $("meta").textContent = [site.kind, site.where, site.award, host(site.url)].filter(Boolean).join("  ·  ");
  $("open").href = site.url;
  $("badge").className = "badge " + (site.shot ? "shot" : "live");
  $("badge").textContent = site.shot ? "Screenshot" : "Live";
  $("badge").title = site.shot ? "This site refuses to load inside an iframe, so a full-page screenshot is shown. Scroll it with the mouse." : "The real site, running live.";
  fill($("desktop"), site, "desktop");
  fill($("mobile"), site, "mobile");
  document.querySelectorAll("[data-i]").forEach((b) => b.setAttribute("aria-current", String(+b.dataset.i === index)));
  history.replaceState(null, "", "#" + (index + 1));
}

// ---------- ticks and the site list ----------
SITES.forEach((site, i) => {
  const b = document.createElement("button");
  b.dataset.i = i;
  b.title = site.name;
  b.onclick = () => show(i);
  $("ticks").append(b);
});
$("list").innerHTML = GROUPS.map(([group, sites]) =>
  `<h2>${group}</h2><div class="grid">${sites.map((s) => {
    const i = SITES.findIndex((x) => x.url === s.url);
    return `<button data-i="${i}"><b>${pad(i + 1)}  ${s.name}</b><span>${s.kind}${s.award ? " · " + s.award : ""}${s.shot ? " · screenshot" : ""}</span></button>`;
  }).join("")}</div>`).join("");
$("list").addEventListener("click", (e) => {
  const b = e.target.closest("[data-i]");
  if (b) { show(+b.dataset.i); toggleList(false); }
  else if (e.target === $("list")) toggleList(false);
});
const toggleList = (open = !$("list").classList.contains("open")) => $("list").classList.toggle("open", open);
$("listBtn").onclick = () => toggleList();
$("total").textContent = pad(SITES.length);

// ---------- keyboard ----------
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const listOpen = $("list").classList.contains("open");
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { show(index + 1); if (listOpen) toggleList(false); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { show(index - 1); if (listOpen) toggleList(false); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(SITES.length - 1);
  else if (e.key === "l" || e.key === "L") toggleList();
  else if (e.key === "Escape") toggleList(false);
  else if (e.key === "r" || e.key === "R") show(index);
  else if (e.key === "o" || e.key === "O") open(SITES[index].url, "_blank", "noopener");
  else return;
  e.preventDefault();
});
// Clicking into a site gives its iframe the keyboard, and the arrow keys would then go to the
// site. Hand the keyboard straight back so the arrows keep switching sites (clicks and mouse
// scrolling inside the site still work).
addEventListener("blur", () => setTimeout(() => {
  if (document.activeElement?.tagName === "IFRAME") document.activeElement.blur();
}, 0));

fit();
show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
