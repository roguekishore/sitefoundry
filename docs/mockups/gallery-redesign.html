<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SITEFOUNDRY Gallery Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #ffffff; --fg: #09090b; --card: #ffffff; --muted: #f4f4f5; --muted-fg: #71717a;
  --border: #e4e4e7; --input: #e4e4e7; --accent: #f4f4f5; --ring: #a1a1aa;
  --primary: #18181b; --primary-fg: #fafafa; --sidebar: #fafafa; --stage: #f4f4f5;
  --stage-dot: #e4e4e7; --overlay: rgb(0 0 0 / .45);
  --shadow-sm: 0 1px 2px rgb(0 0 0 / .05); --shadow-lg: 0 12px 32px -8px rgb(0 0 0 / .18), 0 2px 6px rgb(0 0 0 / .06);
  --note-bg: #fffbeb; --note-fg: #78350f; --note-bd: #f59e0b; --hl: #2563eb;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b; --fg: #fafafa; --card: #0c0c0e; --muted: #18181b; --muted-fg: #a1a1aa;
    --border: #27272a; --input: #27272a; --accent: #1c1c1f; --ring: #52525b;
    --primary: #fafafa; --primary-fg: #18181b; --sidebar: #0c0c0e; --stage: #111113;
    --stage-dot: #1f1f23; --overlay: rgb(0 0 0 / .65);
    --shadow-lg: 0 12px 32px -8px rgb(0 0 0 / .6);
    --note-bg: #2a2110; --note-fg: #fcd34d; --note-bd: #b45309; --hl: #60a5fa;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b; --fg: #fafafa; --card: #0c0c0e; --muted: #18181b; --muted-fg: #a1a1aa;
  --border: #27272a; --input: #27272a; --accent: #1c1c1f; --ring: #52525b;
  --primary: #fafafa; --primary-fg: #18181b; --sidebar: #0c0c0e; --stage: #111113;
  --stage-dot: #1f1f23; --overlay: rgb(0 0 0 / .65);
  --shadow-lg: 0 12px 32px -8px rgb(0 0 0 / .6);
  --note-bg: #2a2110; --note-fg: #fcd34d; --note-bd: #b45309; --hl: #60a5fa;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
.mono { font-family: "Geist Mono", ui-monospace, "Cascadia Code", monospace; }
.muted { color: var(--muted-fg); }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100dvh; }
.sidebar { position: sticky; top: 0; height: 100dvh; overflow-y: auto; background: var(--sidebar); border-right: 1px solid var(--border); padding: 12px 10px 16px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 2px; font-weight: 600; letter-spacing: -.01em; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.brand small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted-fg); margin-top: -2px; }
.nav-group h6 { margin: 0 0 4px; padding: 0 8px; font-size: 11.5px; font-weight: 500; color: var(--muted-fg); }
.nav-link { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 8px; border-radius: 7px; color: var(--fg); font-size: 13.5px; }
.nav-link:hover { background: var(--accent); }
.nav-link.on { background: var(--accent); font-weight: 500; }
.nav-link .count { margin-left: auto; font-size: 11.5px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); }
.sidebar-foot { margin-top: auto; padding: 10px 8px 0; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-fg); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 40; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13.5px; color: var(--muted-fg); white-space: nowrap; overflow: hidden; }
.crumbs a:hover { color: var(--fg); }
.crumbs .cur { color: var(--fg); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.crumbs .sep { opacity: .5; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.search-btn { display: flex; align-items: center; gap: 8px; height: 34px; width: 260px; padding: 0 6px 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--muted); color: var(--muted-fg); font-size: 13px; }
.search-btn:hover { border-color: var(--ring); }
.kbd { margin-left: auto; font: 500 11px "Geist Mono", monospace; padding: 2px 5px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--muted-fg); }
.icon-btn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); }
.icon-btn:hover { background: var(--accent); }
.icon-btn.ghost { border-color: transparent; }
.menu-btn { display: none; }
.note-toggle { height: 34px; padding: 0 10px; border-radius: 8px; border: 1px dashed var(--note-bd); background: var(--note-bg); color: var(--note-fg); font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.note-toggle[aria-pressed="false"] { background: transparent; color: var(--muted-fg); border-color: var(--border); }

.view { flex: 1; min-width: 0; }
.page { max-width: 1360px; margin: 0 auto; padding: 24px 24px 80px; }
.page-head h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.page-head p { margin: 4px 0 0; color: var(--muted-fg); }
.section-head { display: flex; align-items: baseline; gap: 10px; margin: 32px 0 12px; }
.section-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.section-head a { margin-left: auto; font-size: 13px; color: var(--muted-fg); }
.section-head a:hover { color: var(--fg); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--accent); }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn.primary:hover { opacity: .9; }
.btn.ghost { border-color: transparent; }
.btn.dashed { border-style: dashed; }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--muted); }
.seg button { height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--muted-fg); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--bg); color: var(--fg); box-shadow: var(--shadow-sm); }
.seg .n { font-size: 11px; color: var(--muted-fg); font-variant-numeric: tabular-nums; font-weight: 400; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--muted); color: var(--muted-fg); font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.badge.outline { background: transparent; border: 1px solid var(--border); }
.badge.js { background: color-mix(in srgb, #f59e0b 16%, transparent); color: #b45309; }
:root[data-theme="dark"] .badge.js { color: #fbbf24; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.js { color: #fbbf24; } }
.sep-v { width: 1px; height: 20px; background: var(--border); }
.input { height: 32px; width: 100%; border: 1px solid var(--input); border-radius: 8px; background: transparent; padding: 0 10px 0 32px; font-size: 13px; outline: none; }
.input:focus { border-color: var(--ring); }
.input-wrap { position: relative; }
.input-wrap > svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--muted-fg); }

/* ---------- filter bar ---------- */
.filters { position: sticky; top: 52px; z-index: 20; background: var(--bg); padding: 12px 0; margin: 0 0 4px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.filters-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filters-row > .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.filters-row .grow { flex: 1; min-width: 180px; max-width: 300px; }
.filters-row .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.facet-vals { display: inline-flex; gap: 4px; margin-left: 2px; padding-left: 8px; border-left: 1px solid var(--border); }
.facet-vals .badge { height: 18px; font-size: 11px; background: var(--muted); color: var(--fg); }
.result-count { font-size: 12.5px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }

/* ---------- cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; padding-top: 16px; }
.card { position: relative; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 12px; background: var(--card); overflow: hidden; transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: color-mix(in srgb, var(--fg) 22%, transparent); box-shadow: var(--shadow-sm); }
.thumb { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-bottom: 1px solid var(--border); background: var(--muted); }
.thumb svg { display: block; width: 100%; height: 100%; }
.thumb .js-chip { position: absolute; top: 8px; right: 8px; }
.thumb .hover-actions { position: absolute; inset: auto 8px 8px 8px; display: flex; gap: 6px; justify-content: flex-end; opacity: 0; translate: 0 4px; transition: .15s; }
.card:hover .hover-actions, .card:focus-within .hover-actions { opacity: 1; translate: 0 0; }
.hover-actions .btn { height: 28px; font-size: 12px; box-shadow: var(--shadow-sm); }
.card-body { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 3px; }
.card-title { font-weight: 500; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-name { font-size: 12px; color: var(--muted-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.card > a.cover { position: absolute; inset: 0; z-index: 1; }
.card .hover-actions, .card .js-chip { z-index: 2; }

.list { display: flex; flex-direction: column; padding-top: 8px; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1.4fr) minmax(0, 2fr) 120px 110px; align-items: center; gap: 14px; padding: 8px 6px; border-bottom: 1px solid var(--border); border-radius: 0; }
.row:hover { background: var(--accent); }
.row .mini { width: 96px; aspect-ratio: 16/10; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
.row .mini svg { width: 100%; height: 100%; display: block; }
.row .desc { color: var(--muted-fg); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.site-card { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--card); transition: .15s; }
.site-card:hover { border-color: color-mix(in srgb, var(--fg) 22%, transparent); box-shadow: var(--shadow-sm); }
.site-card .shot { aspect-ratio: 16 / 9.5; overflow: hidden; border-bottom: 1px solid var(--border); position: relative; }
.site-card .shot .stack { position: absolute; inset: 0; display: flex; flex-direction: column; }
.site-card .shot svg { display: block; width: 100%; flex: none; }
.site-card .body { padding: 12px 14px 14px; display: flex; align-items: center; gap: 12px; }
.site-card h3 { margin: 0; font-size: 14.5px; font-weight: 600; }
.site-card .sub { font-size: 12.5px; color: var(--muted-fg); }
.swatches { display: flex; margin-left: auto; }
.swatches span { width: 14px; height: 14px; border-radius: 50%; margin-left: -4px; box-shadow: 0 0 0 2px var(--card), inset 0 0 0 1px rgb(0 0 0 / .1); }

/* ---------- popovers, dialogs ---------- */
.pop { position: fixed; z-index: 70; min-width: 220px; max-width: calc(100vw - 24px); border: 1px solid var(--border); border-radius: 12px; background: var(--card); box-shadow: var(--shadow-lg); padding: 6px; display: none; }
.pop.open { display: block; animation: pop-in .12s ease-out; }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.pop h6 { margin: 6px 8px 4px; font-size: 11.5px; font-weight: 500; color: var(--muted-fg); }
.pop .opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border-radius: 7px; text-align: left; font-size: 13px; }
.pop .opt:hover, .pop .opt.active { background: var(--accent); }
.pop .opt .chk { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--ring); display: grid; place-items: center; flex: none; }
.pop .opt .chk.on { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.pop .opt .chk svg { width: 12px; height: 12px; stroke-width: 3; }
.pop .opt .n { margin-left: auto; font-size: 11.5px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
.pop .opt .desc { display: block; font-size: 11.5px; color: var(--muted-fg); }
.pop hr { border: 0; border-top: 1px solid var(--border); margin: 6px -6px; }
.pop .scroll { max-height: 320px; overflow-y: auto; }
.pop .search { padding: 2px 2px 6px; border-bottom: 1px solid var(--border); margin: 0 -6px 6px; padding: 0 6px 6px; }
.pop .search input { height: 32px; width: 100%; border: 0; outline: none; background: transparent; padding: 0 6px; font-size: 13px; }
.sw4 { display: inline-flex; flex: none; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1); }
.sw4 span { width: 9px; height: 20px; }

.overlay { position: fixed; inset: 0; z-index: 80; background: var(--overlay); display: none; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; }
.overlay.open { display: flex; animation: fade .12s; }
@keyframes fade { from { opacity: 0; } }
.cmdk { width: 640px; max-width: 100%; border: 1px solid var(--border); border-radius: 14px; background: var(--card); box-shadow: var(--shadow-lg); overflow: hidden; }
.cmdk-input { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--border); }
.cmdk-input input { flex: 1; height: 50px; border: 0; outline: none; background: transparent; font-size: 15px; }
.cmdk-list { max-height: 420px; overflow-y: auto; padding: 6px; }
.cmdk-list h6 { margin: 8px 8px 4px; font-size: 11.5px; font-weight: 500; color: var(--muted-fg); }
.cmdk-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; cursor: pointer; }
.cmdk-item.active { background: var(--accent); }
.cmdk-item .hint { margin-left: auto; font-size: 12px; color: var(--muted-fg); }
.cmdk-foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-fg); }
.dialog { width: 980px; max-width: 100%; max-height: 82vh; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 14px; background: var(--card); box-shadow: var(--shadow-lg); overflow: hidden; margin-top: -4vh; }
.dialog-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.dialog-head h3 { margin: 0; font-size: 15px; font-weight: 600; }

/* ---------- preview stage ---------- */
.stage { position: relative; background: var(--stage); background-image: radial-gradient(var(--stage-dot) 1px, transparent 1px); background-size: 16px 16px; overflow: hidden; }
.stage-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--card); flex-wrap: wrap; }
.stage-toolbar .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.device-wrap { display: flex; justify-content: center; padding: 24px; }
.device { flex: none; transform-origin: top center; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--border), var(--shadow-lg); background: #fff; }
.device.phone { border-radius: 28px; box-shadow: 0 0 0 8px #18181b, 0 0 0 9px #3f3f46, var(--shadow-lg); }
.screen { overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
.theme-btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px 0 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-size: 13px; font-weight: 500; white-space: nowrap; }
.theme-btn:hover { background: var(--accent); }
.theme-btn .lbl { color: var(--muted-fg); font-weight: 400; }

/* ---------- site viewer ---------- */
.viewer { display: grid; grid-template-columns: 252px minmax(0, 1fr) 320px; height: calc(100dvh - 52px); }
.pane { border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg); }
.pane.right { border-right: 0; border-left: 1px solid var(--border); }
.pane-sec { padding: 14px 12px; border-bottom: 1px solid var(--border); }
.pane-sec h6 { margin: 0 0 8px; padding: 0 6px; font-size: 11.5px; font-weight: 500; color: var(--muted-fg); display: flex; align-items: center; gap: 6px; }
.pane-sec h6 .n { margin-left: auto; }
.site-switch { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 9px; border: 1px solid var(--border); text-align: left; }
.site-switch:hover { background: var(--accent); }
.site-switch .t { font-weight: 600; font-size: 13.5px; }
.site-switch .s { font-size: 12px; color: var(--muted-fg); }
.p-link { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px; border-radius: 7px; font-size: 13px; text-align: left; }
.p-link:hover { background: var(--accent); }
.p-link.on { background: var(--accent); font-weight: 500; }
.p-link .n { margin-left: auto; font-size: 11.5px; color: var(--muted-fg); }
.p-link .idx { width: 18px; font-size: 11px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
.p-link.sel { box-shadow: inset 2px 0 0 var(--hl); background: color-mix(in srgb, var(--hl) 10%, transparent); }
.p-link.sel-h { background: var(--accent); }
.badge svg.i { width: 11px; height: 11px; }
.screen { position: relative; }
.p-link.ghosty { color: var(--muted-fg); font-style: italic; }
.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--stage); }
.center .stage { flex: 1; min-height: 0; overflow: auto; }
.browser { flex: none; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--border), var(--shadow-lg); background: var(--card); transform-origin: top center; }
.browser.phone { border-radius: 30px; box-shadow: 0 0 0 9px #18181b, 0 0 0 10px #3f3f46, var(--shadow-lg); }
.browser-bar { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border-bottom: 1px solid var(--border); background: var(--card); }
.browser-bar .lights { display: flex; gap: 6px; }
.browser-bar .lights span { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
.addr { flex: 1; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 7px; background: var(--muted); font-size: 12.5px; color: var(--muted-fg); min-width: 0; overflow: hidden; white-space: nowrap; }
.addr b { color: var(--fg); font-weight: 500; }
.browser-bar .icon-btn { width: 26px; height: 26px; border: 0; background: transparent; border-radius: 6px; }
.browser-bar .icon-btn:hover { background: var(--accent); }
.browser-bar .icon-btn[disabled] { opacity: .35; pointer-events: none; }
.sec { position: relative; cursor: pointer; }
.sec svg { display: block; width: 100%; height: auto; margin: 0 auto; }
.sec::after { content: ""; position: absolute; inset: 0; pointer-events: none; transition: box-shadow .1s; }
.sec.hover::after { box-shadow: inset 0 0 0 2px var(--hl); }
.sec.selected::after { box-shadow: inset 0 0 0 2px var(--hl); background: color-mix(in srgb, var(--hl) 6%, transparent); }
.sec.plain { cursor: auto; }
.sec .tag { position: absolute; top: 0; left: 0; z-index: 2; display: none; padding: 3px 8px; background: var(--hl); color: #fff; font: 500 12px "Geist Mono", monospace; border-bottom-right-radius: 6px; }
.sec.hover .tag, .sec.selected .tag { display: block; }
.site-nav { display: flex; align-items: center; gap: 22px; height: 64px; padding: 0 28px; }
.site-nav .logo { font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
.site-nav .links { display: flex; gap: 22px; margin: 0 auto; font-size: 14px; }
.site-nav .links a { opacity: .7; cursor: pointer; }
.site-nav .links a:hover, .site-nav .links a.on { opacity: 1; }
.site-nav .links a.on { text-decoration: underline; text-underline-offset: 6px; }
.site-nav .cta { padding: 8px 16px; border-radius: 99px; font-size: 13.5px; font-weight: 500; }
.site-nav .burger { display: none; margin-left: auto; }
.screen.narrow .site-nav { height: 56px; padding: 0 18px; }
.screen.narrow .site-nav .links, .screen.narrow .site-nav .cta { display: none; }
.screen.narrow .site-nav .burger { display: block; font-size: 22px; line-height: 1; cursor: pointer; }
.mobile-menu { padding: 6px 18px 18px; display: flex; flex-direction: column; }
.mobile-menu a { padding: 12px 0; border-bottom: 1px solid; font-size: 17px; cursor: pointer; }
.insp-title { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.cmd { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--muted); font: 12.5px "Geist Mono", monospace; }
.cmd span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd button { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; color: var(--muted-fg); }
.cmd button:hover { background: var(--bg); color: var(--fg); }
.props { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.props th { text-align: left; font-weight: 500; color: var(--muted-fg); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--border); }
.props td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
.props td.mono { white-space: nowrap; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; font-size: 12.5px; margin: 0; }
.kv dt { color: var(--muted-fg); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.chip-link { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); font: 12px "Geist Mono", monospace; }
.chip-link:hover { background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.mobile-pages { display: none; }

/* ---------- item detail ---------- */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.detail-head { display: flex; gap: 20px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px; }
.detail-head h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
.detail-head .desc { margin: 6px 0 10px; color: var(--muted-fg); max-width: 70ch; }
.panel { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-top: 22px; }
.tabs button { height: 36px; padding: 0 12px; font-size: 13px; font-weight: 500; color: var(--muted-fg); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--fg); border-color: var(--fg); }
.tab-body { padding-top: 14px; }
pre.code { margin: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--muted); font: 12.5px/1.65 "Geist Mono", monospace; overflow-x: auto; }
.code .k { color: #c026d3; } .code .s { color: #16a34a; } .code .c { color: var(--muted-fg); } .code .t { color: #2563eb; }
.rail { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 72px; }
.rail .panel { padding: 14px; }
.rail h6 { margin: 0 0 10px; font-size: 12px; font-weight: 600; }
.mini-item { display: flex; align-items: center; gap: 10px; padding: 6px; margin: 0 -6px; border-radius: 8px; }
.mini-item:hover { background: var(--accent); }
.mini-item .mini { width: 64px; aspect-ratio: 16/10; border-radius: 5px; overflow: hidden; border: 1px solid var(--border); flex: none; }
.mini-item .mini svg { width: 100%; height: 100%; display: block; }
.mini-item .t { font-size: 12.5px; font-weight: 500; }
.mini-item .s { font-size: 11.5px; color: var(--muted-fg); }

/* ---------- mockup notes (not part of the product) ---------- */
.mnote { display: none; position: relative; margin: 10px 0; padding: 9px 12px 9px 34px; border: 1px dashed var(--note-bd); border-radius: 10px; background: var(--note-bg); color: var(--note-fg); font-size: 12.5px; line-height: 1.5; }
.mnote::before { content: attr(data-n); position: absolute; left: 9px; top: 9px; width: 18px; height: 18px; border-radius: 50%; background: var(--note-bd); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
body.notes .mnote { display: block; }
.mnote.float { right: 16px; left: auto !important; }
.mnote.float { position: absolute; z-index: 5; margin: 0; max-width: 300px; box-shadow: var(--shadow-lg); }

.empty { padding: 60px 20px; text-align: center; color: var(--muted-fg); }
.sentinel { height: 1px; }
.loading-more { text-align: center; padding: 18px; font-size: 12.5px; color: var(--muted-fg); }

/* ---------- small screens ---------- */
@media (max-width: 1180px) {
  .viewer { grid-template-columns: 232px minmax(0, 1fr); }
  .viewer .pane.right { display: none; }
  .viewer.inspecting .pane.right { display: block; position: fixed; right: 0; top: 52px; bottom: 0; width: min(340px, 100vw); z-index: 30; box-shadow: var(--shadow-lg); }
  .detail { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; z-index: 90; left: 0; top: 0; width: 280px; translate: -100% 0; transition: translate .2s; box-shadow: var(--shadow-lg); }
  body.nav-open .sidebar { translate: 0 0; }
  body.nav-open .scrim { display: block; }
  .menu-btn { display: grid; }
  .search-btn { width: 34px; padding: 0; justify-content: center; }
  .search-btn .lbl, .search-btn .kbd { display: none; }
  .note-toggle .lbl { display: none; }
  .page { padding: 16px 16px 64px; }
  .viewer { grid-template-columns: minmax(0, 1fr); height: calc(100dvh - 52px); }
  .top-tools .seg, .top-tools .sep-v, .top-tools [data-act="inspect-toggle"] .t { display: none; }
  .top-tools .theme-btn > span:not(.sw4) { display: none; }
  .top-tools .theme-btn > svg { display: none; }
  .top-tools .theme-btn { padding: 0 6px; }
  .top-tools .btn.sm { padding: 0 8px; }
  .app.focus .crumbs > :not(.cur) { display: none; }
  .center .mnote.float { display: none !important; }
  .full .mnote.float { top: auto !important; bottom: 56px !important; left: 12px !important; right: 12px; max-width: none; }
  .viewer .pane.left { display: none; }
  .mobile-pages { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); overflow-x: auto; background: var(--bg); }
  .mobile-pages .p-link { width: auto; flex: none; border: 1px solid var(--border); height: 30px; }
  .viewer.inspecting .pane.right { top: auto; bottom: 0; left: 0; width: 100%; height: 62dvh; border-left: 0; border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; }
  .row { grid-template-columns: 72px minmax(0, 1fr); }
  .row .mini { width: 72px; }
  .row .desc, .row .c4, .row .c5 { display: none; }
  .filters { top: 52px; }
  .filters-row .right { margin-left: 0; width: 100%; justify-content: space-between; }
  .filters-row > .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.filters-row .grow { max-width: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card-meta { display: none; }
  .thumb .hover-actions { display: none; }
  .crumbs .hide-sm { display: none; }
  .device-wrap { padding: 12px; }
}
.app.focus { grid-template-columns: minmax(0, 1fr); }
.app.focus .sidebar { position: fixed; z-index: 90; left: 0; top: 0; width: 280px; translate: -100% 0; transition: translate .2s; box-shadow: var(--shadow-lg); }
body.nav-open .app.focus .sidebar { translate: 0 0; }
.app.focus .menu-btn { display: grid; }
body.nav-open .scrim { display: block; }
/* site viewer: preview controls live in the top bar */
.top-tools { display: flex; align-items: center; gap: 8px; margin-left: auto; min-width: 0; }
.top-tools:empty { display: none; }
.top-tools:not(:empty) + .top-actions { margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--border); }
.crumbs { flex: 0 1 auto; }
.app.focus .search-btn { width: 34px; padding: 0; justify-content: center; }
.app.focus .search-btn .lbl, .app.focus .search-btn .kbd { display: none; }
.app.focus .note-toggle .lbl { display: none; }
.browser.native { border-radius: 0; box-shadow: none; }

/* full screen: the site alone, as a visitor on that device sees it */
body.fullmode .sidebar, body.fullmode .topbar { display: none; }
body.fullmode .app { grid-template-columns: minmax(0, 1fr); }
.full { position: fixed; inset: 0; display: flex; justify-content: center; background: var(--stage); background-image: radial-gradient(var(--stage-dot) 1px, transparent 1px); background-size: 16px 16px; }
.full-site { height: 100dvh; overflow-y: auto; overflow-x: hidden; position: relative; box-shadow: 0 0 0 1px var(--border); }
.full-bar { position: fixed; left: 12px; bottom: 12px; z-index: 50; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 99px; background: rgb(24 24 27 / .82); color: #fafafa; backdrop-filter: blur(8px); font-size: 12.5px; opacity: .35; transition: opacity .15s; }
.full-bar:hover, .full-bar:focus-within { opacity: 1; }
.full-bar a, .full-bar button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 99px; color: inherit; }
.full-bar a:hover, .full-bar button:hover { background: rgb(255 255 255 / .12); }
.full-bar .on { background: rgb(255 255 255 / .18); }
.full .mnote.float { top: 16px; right: 16px; bottom: auto; }

.scrim { display: none; position: fixed; inset: 0; z-index: 85; background: var(--overlay); }
</style>
</head>

<script>

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (id, cls = "") => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const hash = (s) => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };

const ITEMS = DATA.items.filter((i) => !["lib", "base"].includes(i.t) && i.n !== "shadcn-use-mobile");
const BY = new Map(DATA.items.map((i) => [i.n, i]));
const sourceOf = (i) => (i.g === "shadcn" ? "shadcn" : i.g === "reactbits" ? "reactbits" : "foundry");
const SOURCE_LABEL = { foundry: "Recreations", shadcn: "shadcn", reactbits: "React Bits" };
const TYPE_LABEL = { block: "Blocks", component: "Components", theme: "Themes" };
const titleCase = (s) => s.replace(/(^|-)(\w)/g, (_, d, c) => (d ? " " : "") + c.toUpperCase());

// ---------- palettes: each site's own colours, light and dark ----------
const P = (bg, fg, pr, mu) => ({ bg, fg, pr, mu });
const THEMES = [
  { id: "own", label: "Own theme", desc: "each item in its site's colours" },
  { id: "foundry-base", label: "Base defaults", group: "Foundry", light: P("#ffffff", "#0a0a0a", "#171717", "#f5f5f5"), dark: P("#0a0a0a", "#fafafa", "#fafafa", "#262626") },
  { id: "clerk-theme", site: "clerk", label: "Clerk", group: "Recreated sites", light: P("#f9f9fa", "#1d1d22", "#6c47ff", "#efeff2"), dark: P("#1d1d22", "#ffffff", "#9b87ff", "#2f2f36") },
  { id: "halodental-sonnet-theme", site: "halodental-sonnet", label: "Halo Dental", group: "Recreated sites", light: P("#f4f1ee", "#0a0a0a", "#ef5f2c", "#e7e3de"), dark: P("#000000", "#ffffff", "#ef5f2c", "#2e2828") },
  { id: "huly-theme", site: "huly", label: "Huly", group: "Recreated sites", light: P("#f7f7f7", "#1a1b1f", "#222327", "#ededf0"), dark: P("#0f1013", "#fcfcfc", "#d4d4d4", "#1c1d22") },
  { id: "mercury-theme", site: "mercury", label: "Mercury", group: "Recreated sites", light: P("#f5f5fa", "#23223a", "#5b52e0", "#e9e9f3"), dark: P("#23223a", "#efeff6", "#6d64f0", "#33324d") },
  { id: "newhalo-theme", site: "newhalo", label: "Newhalo", group: "Recreated sites", light: P("#f6f2ee", "#000000", "#f2602a", "#e9e3dd"), dark: P("#000000", "#ffffff", "#f2602a", "#3a3232") },

  { id: "sample-ember", site: "sample", label: "Sample Ember", group: "Samples", light: P("#fbf5ec", "#3d2418", "#b0532c", "#f1e6d6"), dark: P("#2a1d16", "#f7f0e6", "#d0693f", "#3b2c23") },
  { id: "sample-midnight", label: "Sample Midnight", group: "Samples", light: P("#fbfbfe", "#262842", "#5b3fe0", "#eff0f9"), dark: P("#0f1124", "#f3f3f8", "#8d74f2", "#1c1f38") },
  { id: "shadcn-theme-zinc", label: "shadcn Zinc", group: "shadcn", light: P("#ffffff", "#09090b", "#18181b", "#f4f4f5"), dark: P("#09090b", "#fafafa", "#fafafa", "#27272a") },
  { id: "shadcn-theme-neutral", label: "shadcn Neutral", group: "shadcn", light: P("#ffffff", "#0a0a0a", "#171717", "#f5f5f5"), dark: P("#0a0a0a", "#fafafa", "#e5e5e5", "#262626") },
  { id: "shadcn-theme-slate", label: "shadcn Slate", group: "shadcn", light: P("#ffffff", "#020617", "#0f172a", "#f1f5f9"), dark: P("#020617", "#f8fafc", "#e2e8f0", "#1e293b") },
  { id: "shadcn-theme-stone", label: "shadcn Stone", group: "shadcn", light: P("#ffffff", "#0c0a09", "#1c1917", "#f5f5f4"), dark: P("#0c0a09", "#fafaf9", "#e7e5e4", "#292524") },
  { id: "shadcn-theme-gray", label: "shadcn Gray", group: "shadcn", light: P("#ffffff", "#030712", "#111827", "#f3f4f6"), dark: P("#030712", "#f9fafb", "#e5e7eb", "#1f2937") },
];
const THEME = new Map(THEMES.map((t) => [t.id, t]));
const SITE_FROM = { clerk: "clerk.com", "halodental-sonnet": "halodental.com", huly: "huly.io", mercury: "mercury.com", newhalo: "halodental.com", stripe: "stripe.com", sample: "made up" };
const SITE_LABEL = { clerk: "Clerk", "halodental-sonnet": "Halo Dental (Sonnet)", huly: "Huly", mercury: "Mercury", newhalo: "Newhalo", stripe: "Stripe", sample: "Sample" };
const SITE_THEME = { clerk: "clerk-theme", "halodental-sonnet": "halodental-sonnet-theme", huly: "huly-theme", mercury: "mercury-theme", newhalo: "newhalo-theme", stripe: "stripe-theme", sample: "sample-ember" };
const SITES = Object.keys(DATA.sites).sort((a, b) => Object.keys(DATA.sites[b]).length - Object.keys(DATA.sites[a]).length || a.localeCompare(b));
const NON_VISUAL = /smooth-scroll/;

function ownPalette(item, mode) {
  if (item.t === "theme" && THEME.get(item.n)) return THEME.get(item.n)[mode];
  const src = sourceOf(item);
  if (src === "shadcn") return THEME.get("shadcn-theme-zinc")[mode];
  if (src === "reactbits") {
    const hue = hash(item.n) % 360;
    return P(mode === "light" ? "#fafafa" : "#0b0b10", mode === "light" ? "#18181b" : "#f4f4f5", `hsl(${hue} 85% 60%)`, mode === "light" ? "#ececf1" : "#1a1a22");
  }
  const t = THEME.get(SITE_THEME[item.g]);
  if (!t) return THEME.get("foundry-base")[mode];
  // blocks the site always shows dark (e.g. newhalo hero) keep their dark look
  return (item.tg || []).includes("dark") ? t.dark : t[mode];
}
function palette(item, themeId, mode) {
  if (!themeId || themeId === "own") return ownPalette(item, mode);
  const t = THEME.get(themeId);
  return t ? t[mode] : ownPalette(item, mode);
}

// ---------- wireframes: one drawing per category, coloured by the palette ----------
function wire(item, p, opts = {}) {
  const W = 320, H = opts.h || 200;
  const r = (x, y, w, h, f, rx = 3, o = 1) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" opacity="${o}"/>`;
  const c = (x, y, rad, f, o = 1) => `<circle cx="${x}" cy="${y}" r="${rad}" fill="${f}" opacity="${o}"/>`;
  const lines = (x, y, w, n, gap = 9, o = 0.3, hgt = 4) => Array.from({ length: n }, (_, k) => r(x, y + k * gap, k === n - 1 ? w * 0.6 : w, hgt, p.fg, 2, o)).join("");
  const seed = hash(item.n);
  const cat = item.t === "theme" ? "theme" : item.c || "card";
  let g = "";
  const name = item.n;
  const title = (y, w = 150, center = true) => r(center ? (W - w) / 2 : 22, y, w, 11, p.fg, 3, 0.9);
  switch (cat) {
    case "hero": {
      const dark = (item.tg || []).includes("dark");
      if (dark || /panel|fullscreen/.test((item.tg || []).join())) {
        g += r(6, 6, 308, H - 12, p.mu, 8) + `<rect x="6" y="6" width="308" height="${H - 12}" rx="8" fill="url(#gr${seed})" opacity=".55"/>`;
        g += r(18, H - 62, 170, 40, p.fg, 3, 0.95) + r(220, H - 52, 80, 9, p.fg, 2, 0.8) + c(255, 90, 16, p.pr);
      } else {
        g += r(130, 26, 60, 8, p.mu, 4) + title(44, 210) + title(60, 150) + lines(100, 82, 120, 2, 8);
        g += r(112, 104, 46, 14, p.pr, 7) + `<rect x="163" y="104.5" width="45" height="13" rx="6.5" fill="none" stroke="${p.fg}" stroke-opacity=".3"/>`;
        g += r(36, 132, 248, H - 132, p.mu, 8) + r(52, 146, 90, 6, p.fg, 2, 0.2) + r(52, 158, 216, 40, p.bg, 4, 0.7);
      }
      break;
    }

// ---------- settings (per browser, optional) ----------
const settings = (() => {
  const d = { chrome: "system", device: "desktop", theme: "own", pmode: "light", notes: true, view: "grid" };
  try { return { ...d, ...JSON.parse(localStorage.getItem("sf-mock") || "{}") }; } catch { return d; }
})();
function save() { try { localStorage.setItem("sf-mock", JSON.stringify(settings)); } catch {} }
function applyChrome() {
  const root = document.documentElement;
  if (settings.chrome === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", settings.chrome);
  const dark = settings.chrome === "dark" || (settings.chrome === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  $("#modeBtn").innerHTML = icon(dark ? "sun" : "moon");
  document.body.classList.toggle("notes", settings.notes);
  $(".note-toggle").setAttribute("aria-pressed", String(settings.notes));
}

// ---------- routing: everything is in the URL ----------
function parseRoute() {
  const [path, qs] = location.hash.replace(/^#\/?/, "").split("?");
  return { parts: path.split("/").filter(Boolean).map(decodeURIComponent), q: new URLSearchParams(qs || "") };
}
const go = (h) => { location.hash = h; };

// ---------- sidebar ----------
const count = (f) => ITEMS.filter(f).length;
function renderSidebar(route) {
  const key = route.parts.join("/") + "?" + route.q.toString();
  const on = (test) => (test ? " on" : "");
  const q = route.q;
  const isBrowse = route.parts[0] === "browse" || !route.parts.length;
  const link = (href, ic, label, n, active) => `<a class="nav-link${on(active)}" href="${href}">${ic}<span>${label}</span>${n != null ? `<span class="count">${n}</span>` : ""}</a>`;
  $("#sidebar").innerHTML = `
    <div class="brand"><span class="brand-mark">SF</span><div>SITEFOUNDRY<small>local gallery</small></div></div>
    <div class="nav-group">
      ${link("#/", icon("home"), "Overview", null, !route.parts.length)}
      ${link("#/browse?type=block", icon("layout"), "Blocks", count((i) => i.t === "block"), isBrowse && q.get("type") === "block" && !q.get("source"))}
      ${link("#/browse?type=component", icon("box"), "Components", count((i) => i.t === "component"), isBrowse && q.get("type") === "component" && !q.get("source"))}
      ${link("#/browse?type=theme", icon("palette"), "Themes", count((i) => i.t === "theme"), isBrowse && q.get("type") === "theme")}
    </div>
    <div class="nav-group"><h6>Sources</h6>
      ${["foundry", "shadcn", "reactbits"].map((s) => link(`#/browse?source=${s}`, `<span class="dot" style="background:${s === "foundry" ? "#f2602a" : s === "shadcn" ? "#71717a" : "#8b5cf6"}"></span>`, SOURCE_LABEL[s], count((i) => sourceOf(i) === s), isBrowse && q.get("source") === s && !q.get("type"))).join("")}
    </div>
    <div class="nav-group"><h6>Recreated sites</h6>
      ${SITES.map((s) => { const n = Object.keys(DATA.sites[s]).length; return link(`#/site/${s}`, `<span class="dot" style="background:${THEME.get(SITE_THEME[s]).light.pr}"></span>`, SITE_LABEL[s], n > 1 ? `${n} pages` : "1 page", route.parts[0] === "site" && route.parts[1] === s); }).join("")}
    </div>
    <div class="sidebar-foot">Registry built · ${DATA.items.length} items<br/><span class="mono">localhost:4400</span></div>`;
}

function renderCrumbs(list) {
  $("#crumbs").innerHTML = list.map(([label, href], k) => (k === list.length - 1 ? `<span class="cur">${esc(label)}</span>` : `<a href="${href}" class="${k > 0 ? "hide-sm" : ""}">${esc(label)}</a><span class="sep ${k > 0 ? "hide-sm" : ""}">/</span>`)).join("");
}

// ---------- shared pieces ----------
const badgesFor = (i) => [i.t === "theme" ? "theme" : i.c, sourceOf(i) === "foundry" ? SITE_LABEL[i.g] || i.g : SOURCE_LABEL[sourceOf(i)]].filter(Boolean).map((b) => `<span class="badge">${esc(b)}</span>`).join("") + (i.h ? `<span class="badge js">${icon("zap")}JS</span>` : "");
const installCmd = (i) => (i.t === "theme" ? `foundry theme ${i.n}` : `foundry add ${i.n}`);
function cmdBox(text) { return `<div class="cmd"><span>${esc(text)}</span><button data-copy="${esc(text)}" aria-label="Copy">${icon("copy")}</button></div>`; }
function card(i) {
  return `<article class="card">
    <a class="cover" href="#/item/${i.n}" aria-label="${esc(i.ti)}"></a>
    <div class="thumb">${wire(i, ownPalette(i, "light"))}
      <div class="hover-actions"><button class="btn sm" data-quick="${i.n}">${icon("eye")}Quick look</button><button class="btn sm" data-copy="${esc(installCmd(i))}">${icon("copy")}Copy add</button></div>
    </div>
    <div class="card-body"><div class="card-title">${esc(i.ti)}</div><div class="card-name mono">${i.n}</div><div class="card-meta">${badgesFor(i)}</div></div>
  </article>`;
}
function row(i) {
  return `<a class="row" href="#/item/${i.n}"><div class="mini">${wire(i, ownPalette(i, "light"))}</div><div><div class="card-title">${esc(i.ti)}</div><div class="card-name mono">${i.n}</div></div><div class="desc">${esc(i.d)}</div><div class="c4">${badgesFor(i)}</div><div class="c5 muted mono" style="font-size:12px;text-align:right">${esc(i.v)}</div></a>`;
}
function siteShot(s, mode = "light") {
  const blocks = DATA.sites[s].landing.map((n) => BY.get(n)).filter((i) => i && !NON_VISUAL.test(i.n));
  return `<div class="stack">${blocks.slice(0, 4).map((b) => wire(b, ownPalette(b, mode), { h: b.c === "header" ? 30 : 200, par: "xMidYMin slice" })).join("")}</div>`;
}
function swatches(themeId) { const t = THEME.get(themeId); if (!t) return ""; const p = t.light; return `<div class="swatches">${[p.bg, p.fg, p.pr, p.mu].map((c) => `<span style="background:${c}"></span>`).join("")}</div>`; }
function siteCard(s) {
  const pages = Object.keys(DATA.sites[s]).length;
  const blocks = ITEMS.filter((i) => i.g === s && i.t !== "theme").length;
  return `<a class="site-card" href="#/site/${s}"><div class="shot">${siteShot(s)}</div><div class="body"><div><h3>${SITE_LABEL[s]}</h3><div class="sub">from ${SITE_FROM[s]} · ${pages} page${pages > 1 ? "s" : ""} · ${blocks} items</div></div>${swatches(SITE_THEME[s])}</div></a>`;
}

// ---------- overview ----------
function viewOverview() {

// ---------- browse: tabs + facets + one list ----------
const FACETS = {
  source: { label: "Source", values: () => ["foundry", "shadcn", "reactbits"], name: (v) => SOURCE_LABEL[v], match: (i, v) => sourceOf(i) === v },
  site: { label: "Site", values: () => SITES, name: (v) => SITE_LABEL[v], match: (i, v) => i.g === v },
  category: { label: "Category", values: () => [...new Set(ITEMS.map((i) => i.c).filter(Boolean))].sort(), name: titleCase, match: (i, v) => i.c === v },
  js: { label: "Runtime", values: () => ["static", "js"], name: (v) => (v === "js" ? "Needs JavaScript" : "Static HTML"), match: (i, v) => (v === "js" ? !!i.h : !i.h) },
};
let browseState = null;
function readBrowse(q) {
  const st = { type: q.get("type") || "all", q: q.get("q") || "", sort: q.get("sort") || "relevance" };
  for (const f of Object.keys(FACETS)) st[f] = (q.get(f) || "").split(",").filter(Boolean);
  return st;
}
function writeBrowse(st) {
  const q = new URLSearchParams();
  if (st.type !== "all") q.set("type", st.type);
  for (const f of Object.keys(FACETS)) if (st[f].length) q.set(f, st[f].join(","));
  if (st.q) q.set("q", st.q);
  if (st.sort !== "relevance") q.set("sort", st.sort);
  history.replaceState(null, "", "#/browse" + (q.toString() ? "?" + q : ""));
}
function filterItems(st, skip) {
  const words = st.q.toLowerCase().split(/\s+/).filter(Boolean);
  return ITEMS.filter((i) => {
    if (skip !== "type" && st.type !== "all" && i.t !== st.type) return false;
    for (const f of Object.keys(FACETS)) if (f !== skip && st[f].length && !st[f].some((v) => FACETS[f].match(i, v))) return false;
    const text = [i.n, i.ti, i.d, i.c, i.g, ...(i.tg || [])].join(" ").toLowerCase();
    return words.every((w) => text.includes(w));
  });
}
function viewBrowse(route) {
  browseState = readBrowse(route.q);
  const st = browseState;
  const title = st.type !== "all" ? TYPE_LABEL[st.type] : st.source.length === 1 ? SOURCE_LABEL[st.source[0]] : "All items";
  renderCrumbs([["Overview", "#/"], [title]]);
  return `<div class="page">
    <div class="page-head"><h1>${esc(title)}</h1><p id="browseSub"></p></div>
    <div class="filters" id="filters"></div>
    <div class="mnote" data-n="3">Type is a tab (it changes what a card means); everything else is a <b>facet</b> with live counts, combinable, removable from the button itself. All of it lives in the URL, so a view like “React Bits text effects that need no JS” can be bookmarked. Counts in each facet reflect the other filters, so you never pick an empty result.</div>
    <div id="results"></div>
    <div class="sentinel" id="sentinel"></div>
    <div class="mnote" data-n="4">The real grid is <b>virtualised</b> (TanStack Virtual): only the rows on screen exist in the page, so 500 or 5,000 items scroll the same and memory stays flat. Thumbnails are lazy-loaded images. <b>Quick look</b> opens one live preview in a dialog; closing it removes the iframe.</div>
  </div>`;
}
function renderFilters() {

  const facetBtn = (f) => {
    const sel = st[f];
    return `<button class="btn dashed" data-facet="${f}">${icon("plus")}${FACETS[f].label}${sel.length ? `<span class="facet-vals">${sel.length > 2 ? `<span class="badge">${sel.length} selected</span>` : sel.map((v) => `<span class="badge">${esc(FACETS[f].name(v))}</span>`).join("")}</span>` : ""}</button>`;

let shown = 0, resultList = [], io;
function renderResults() {
  resultList = filterItems(browseState);

// ---------- facet popover ----------
function openFacet(btn, f) {
  const st = browseState;
  const vals = FACETS[f].values();
  const counts = Object.fromEntries(vals.map((v) => [v, filterItems({ ...st, [f]: [v] }, null).length]));
  const shownVals = vals.filter((v) => counts[v] || st[f].includes(v)).sort((a, b) => (f === "category" ? counts[b] - counts[a] : 0));
  const draw = (needle = "") => shownVals.filter((v) => FACETS[f].name(v).toLowerCase().includes(needle.toLowerCase())).map((v) => {
    const on = st[f].includes(v);
    return `<button class="opt" data-facet-val="${esc(v)}" ${!counts[v] && !on ? 'style="opacity:.45"' : ""}><span class="chk ${on ? "on" : ""}">${on ? icon("check") : ""}</span>${esc(FACETS[f].name(v))}<span class="n">${counts[v]}</span></button>`;
  }).join("") || `<div class="muted" style="padding:10px;font-size:13px">No match</div>`;
  showPop(btn, `${shownVals.length > 8 ? `<div class="search"><input placeholder="${FACETS[f].label}…" id="facetSearch"/></div>` : ""}<div class="scroll" id="facetList">${draw()}</div>${st[f].length ? `<hr/><button class="opt" data-facet-clear style="justify-content:center">Clear</button>` : ""}`, 240);
  const pop = $("#pop");
  pop.onclick = (e) => {
    e.stopPropagation();
    const b = e.target.closest("[data-facet-val]");
    if (b) { const v = b.dataset.facetVal; st[f] = st[f].includes(v) ? st[f].filter((x) => x !== v) : [...st[f], v]; if (f === "source" && st.source.length && !st.source.includes("foundry")) st.site = []; updateBrowse(); openFacet($(`[data-facet="${f}"]`), f); const s = $("#facetSearch"); if (s && needleKeep) { s.value = needleKeep; s.dispatchEvent(new Event("input")); s.focus(); } }
    if (e.target.closest("[data-facet-clear]")) { st[f] = []; updateBrowse(); closePop(); }
  };
  let needleKeep = "";
  const s = $("#facetSearch");
  if (s) { s.focus(); s.oninput = () => { needleKeep = s.value; $("#facetList").innerHTML = draw(s.value); }; }
}

// ---------- popovers ----------
function showPop(anchor, html, minW = 220) {
  const pop = $("#pop");
  pop.innerHTML = html;
  pop.style.minWidth = minW + "px";
  pop.classList.add("open");
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth;
  pop.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + "px";
  const below = r.bottom + 6;
  pop.style.top = (below + pop.offsetHeight > innerHeight - 8 ? Math.max(8, r.top - pop.offsetHeight - 6) : below) + "px";
  pop.dataset.anchor = anchor.dataset.facet || anchor.id || "";
}

    viewer.selected = viewer.selected === n ? null : n;
    viewer.scrollToSel = !!sel.dataset.select;
    history.replaceState(null, "", location.hash.split("?")[0] + (viewer.selected ? `?block=${viewer.selected}` : ""));
    renderViewerPanes(); renderBrowser();
    return;
  }
  const ci = t.closest("[data-cmd]");
  if (ci) runCmd(+ci.dataset.cmd);
});
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-sec], [data-hover]");
  const n = el ? el.dataset.sec || el.dataset.hover : null;
  document.querySelectorAll(".sec.hover, .p-link.sel-h").forEach((x) => (x.dataset.sec || x.dataset.hover) !== n && x.classList.remove("hover", "sel-h"));
  if (n) setHover(n, true);
});
document.addEventListener("input", (e) => {
  if (e.target.id === "filterInput") { browseState.q = e.target.value; writeBrowse(browseState); renderResults(); }
  if (e.target.id === "cmdkInput") { cmdIdx = 0; renderCmd(); }
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmd(); return; }
  if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); openCmd(); return; }
  if (e.key === "Escape") { closeOverlays(); document.body.classList.remove("nav-open"); return; }
  if ($("#cmdk").classList.contains("open")) {
    if (e.key === "ArrowDown") { e.preventDefault(); cmdIdx = Math.min(cmdRows.length - 1, cmdIdx + 1); renderCmd(); }
    if (e.key === "ArrowUp") { e.preventDefault(); cmdIdx = Math.max(0, cmdIdx - 1); renderCmd(); }
    if (e.key === "Enter") { e.preventDefault(); runCmd(cmdIdx); }
  }
});
addEventListener("hashchange", render);
addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => refreshPreview(), 100); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyChrome);
new IntersectionObserver((es) => es[0].isIntersecting && more(), { rootMargin: "600px" }).observe($("#sentinel") || document.body);
// the sentinel is re-created with the browse view: watch for it
new MutationObserver(() => { const s = $("#sentinel"); if (s && !s.__watched) { s.__watched = true; new IntersectionObserver((es) => es[0].isIntersecting && more(), { rootMargin: "600px" }).observe(s); } }).observe($("#view"), { childList: true });

applyChrome();
render();
</script>
